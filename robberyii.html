<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robbery Enter</title>
    <link rel="stylesheet" type="text/css" href="robberycss.css">
    <link rel="shortcut icon" href="https://raw.githubusercontent.com/Harish040805/robberyharishcreations/refs/heads/main/robberlogo.jfif" type="image/x-icon">
    <style>
        body{ background: url('https://raw.githubusercontent.com/Harish040805/robberyharishcreations/refs/heads/main/lockerbg.jpg');
            background-repeat: no-repeat; background-size: cover; background-attachment: fixed; }
        .container { width: 80%; margin: 40px auto; padding: 20px; background-color: #09051f; border: 1px solid #ccc; border-radius: 10px; 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        label { display: block; margin-bottom: 10px; color: #dbdce3; }
        textarea, input[type="number"] { width: 80%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; }
        button { padding: 10px 20px; background-color: #140f2f; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #1e1744; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="font-family: monospace;
    font-size: 70px;
    color: #dbdce3;">Caesar Cipher</h2>
        <form>
            <label for="text">Text:</label>
            <textarea id="text" name="text"></textarea>
            <label for="shift">Shift:</label>
            <input type="number" id="shift" name="shift">
            <br><br>
            <button id="encrypt-btn">Encrypt</button>
            <button id="decrypt-btn">Decrypt</button>
        </form>
        <p id="result"></p>
        <br><br>
        <a href="https://harish040805.github.io/robberyharishcreations/robberyiii.html" target="_self" rel="noopener noreferrer">
            <button class="Enter-the-palace">Enter the Vault</button>
        </a>
    </div>
    <script>
const textArea = document.getElementById('text');
const shiftInput = document.getElementById('shift');
const encryptBtn = document.getElementById('encrypt-btn');
const decryptBtn = document.getElementById('decrypt-btn');
const resultPara = document.getElementById('result');

encryptBtn.addEventListener('click', (e) => {
    e.preventDefault();
    const text = textArea.value.toLowerCase();
    const shift = parseInt(shiftInput.value);
    const encryptedText = caesarCipher(text, shift);
    resultPara.textContent = `Encrypted text: ${encryptedText}`;
    localStorage.setItem('encryptedNumber', encryptedText);
});

decryptBtn.addEventListener('click', (e) => {
    e.preventDefault();
    const text = textArea.value;
    const shift = parseInt(shiftInput.value);
    const decryptedText = caesarCipher(text, -shift);
    resultPara.textContent = `Decrypted text: ${decryptedText}`;
});

function caesarCipher(text, shift) {
    let result = '';
    for (let i = 0; i < text.length; i++) {
        const charCode = text.charCodeAt(i);
        if (charCode >= 97 && charCode <= 122) {
            const position = charCode - 97;
            const newPosition = (position + shift) % 26;
            result += newPosition.toString();
        } else {
            result += text[i];
        }
    }
    return result;
}
    </script>
</body>
</html>
