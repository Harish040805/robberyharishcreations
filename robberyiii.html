<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robbery Bank Pin</title>
    <link rel="stylesheet" type="text/css" href="robberycss.css">
    <link rel="shortcut icon" href="https://raw.githubusercontent.com/Harish040805/robberyharishcreations/refs/heads/main/robberlogo.jfif" type="image/x-icon">
    <style>
        body{
            background: url('');
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <div class="lockerfix">
    <div class="locker">
        <div class="screen">
            <p id="display"></p>
            <input type="text" id="input" disabled>
        </div>
        <center>
            <div class="buttons">
                <button class="num-button" data-value="1">1</button>
                <button class="num-button" data-value="2">2</button>
                <button class="num-button" data-value="3">3</button>
                <button class="num-button" data-value="4">4</button>
                <button class="num-button" data-value="5">5</button>
                <button class="num-button" data-value="6">6</button>
                <button class="num-button" data-value="7">7</button>
                <button class="num-button" data-value="8">8</button>
                <button class="num-button" data-value="9">9</button>
                <button class="num-button" data-value="0">0</button>
                <button class="clear-button" id="clear">Clear</button>
                <button class="enter-button" id="enter">Enter</button>
            </div>
        </center>
    </div>
    </div>
    <a href="https://harish040805.github.io/robberyharishcreations/robberyii.html">
        <button id="backbutton">Back</button>
    </a>
<script>
    const displayField = document.getElementById('display');
    const clearButton = document.getElementById('clear');
    const enterButton = document.getElementById('enter');
    const numButtons = document.querySelectorAll('.num-button');

    let currentValue = '';
    let encryptedNumber = localStorage.getItem('encryptedNumber'); // Get the encrypted number from local storage

    numButtons.forEach((button) => {
        button.addEventListener('click', () => {
            currentValue += button.dataset.value;
            displayField.textContent = currentValue;
        });
    });

    clearButton.addEventListener('click', () => {
        currentValue = '';
        displayField.textContent = currentValue;
    });

    enterButton.addEventListener('click', () => {
    if (currentValue === encryptedNumber) {
        alert('Locker opened!');
        window.location.href = "https://harish040805.github.io/robberyharishcreations/robberyiv.html";
    } else {
        alert('Warning: Incorrect code!');
    }
});
</script>
</body>
</html>
